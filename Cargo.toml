[workspace]
members = ["node", "python", "wasm"]
# cargo-fuzz keeps its own lockfile and nightly-only dependencies.
exclude = ["fuzz"]

[package]
name = "anydoc"
version = "0.1.7"
edition = "2024"
# Edition 2024 needs 1.85; zip and calamine both raise it to 1.88.
rust-version = "1.88"
description = "Convert documents (doc, docx, odt, rtf, epub, pdf, presentations, spreadsheets, csv) to GitHub-Flavored Markdown"
license = "MIT"
repository = "https://github.com/firecrawl/anydoc"
readme = "README.md"
keywords = ["markdown", "docx", "pdf", "converter", "document"]
categories = ["parser-implementations", "text-processing"]
include = ["/src", "/examples/convert.rs", "/README.md", "/LICENSE"]

[dev-dependencies]
insta = "1"
sha2 = "0.11"

[build-dependencies]
# musl 静态构建时编译 _FORTIFY_SOURCE shim（build.rs，仅 musl target 生效）
cc = "1"

[dependencies]
calamine = { version = "0.36.1", features = ["dates"] }
cfb = "0.14.0"
csv = "1.4.0"
flate2 = "1"
encoding_rs = "0.8.35"
log = "0.4"
pdf-inspector = "0.1.7"
quick-xml = "0.41.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# OCR（any2md 新增）：PP-OCRv5 模型 + MNN 推理，进程内嵌入式
# ocr-rs 即 rust-paddle-ocr 的 crates.io 发布名（2.x 系列，vendored MNN）
ocr-rs = "2.4"
image = "0.25"
# PDF 页渲染为位图（纯 Rust，无外部依赖），供扫描页 OCR 使用
hayro = "0.7"
# CLI（src/bin/any2md.rs）
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"

[profile.release]
lto = "thin"
strip = "symbols"
